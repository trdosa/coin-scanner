<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>코인스캐너</title>
    
    <!-- 모바일 전체화면 앱(PWA) 지원을 위한 메타 태그 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#030712">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (브라우저 내에서 JSX 컴파일) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes scan {
            0% { transform: translateY(-100%); }
            50% { transform: translateY(100%); }
            100% { transform: translateY(-100%); }
        }
        .animate-scan {
            animation: scan 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans selection:bg-amber-500/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const COIN_DATABASE = [
            { id: 1, type: '1원', year: '1966', desc: '최초 발행', condition: '미사용', price: '100,000원+', value: 100000 },
            { id: 2, type: '5원', year: '1966', desc: '최초 발행', condition: '미사용', price: '400,000원 수준', value: 400000 },
            { id: 3, type: '10원', year: '1966~1970', desc: '소재·색상 변화', condition: '미사용', price: '100,000원+', value: 100000 },
            { id: 4, type: '10원', year: '1981', desc: '발행량 적음', condition: '사용', price: '100,000원', value: 100000 },
            { id: 5, type: '10원', year: '1981', desc: '발행량 적음', condition: '미사용', price: '135,000 ~ 155,000원', value: 145000 },
            { id: 6, type: '50원', year: '1972', desc: '최초 발행', condition: '미사용', price: '80,000 ~ 365,000원 (등급에 따라)', value: 200000 },
            { id: 7, type: '100원', year: '1970', desc: '최초 발행', condition: '미사용', price: '50,000원 내외', value: 50000 },
            { id: 8, type: '100원', year: '1971~1998', desc: '연도별 변동', condition: '상태/등급에 따라', price: '20,000 ~ 30,000원대', value: 25000 },
            { id: 9, type: '100원', year: '1998', desc: '발행량 적음', condition: '미사용', price: '120,000 ~ 425,000원', value: 270000 },
            { id: 10, type: '500원', year: '1987', desc: '발행량 적음', condition: '미사용', price: '100,000원+', value: 100000 },
            { id: 11, type: '500원', year: '1998', desc: '민트세트 8,000개 한정', condition: '미사용', price: '3,000,000원 이상', value: 3000000 },
        ];

        const CoinsIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="8" cy="8" r="6" />
                <path d="M18.09 10.37A6 6 0 1 1 10.34 18" />
                <path d="M7 6h2" />
                <path d="M15 12h2" />
            </svg>
        );

        const CameraIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
                <circle cx="12" cy="13" r="3" />
            </svg>
        );

        const ListIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="8" y1="6" x2="21" y2="6" />
                <line x1="8" y1="12" x2="21" y2="12" />
                <line x1="8" y1="18" x2="21" y2="18" />
                <line x1="3" y1="6" x2="3.01" y2="6" />
                <line x1="3" y1="12" x2="3.01" y2="12" />
                <line x1="3" y1="18" x2="3.01" y2="18" />
            </svg>
        );

        const InfoIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="16" x2="12" y2="12" />
                <line x1="12" y1="8" x2="12.01" y2="8" />
            </svg>
        );

        const UploadIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
        );

        const CheckCircleIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
        );

        const AlertTriangleIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                <line x1="12" y1="9" x2="12" y2="13" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
        );

        const RefreshCwIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="23 4 23 10 17 10" />
                <polyline points="1 20 1 14 7 14" />
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
            </svg>
        );

        const SearchIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
        );

        function CoinAppraiser() {
            const [activeTab, setActiveTab] = useState('scan');

            return (
                <div className="min-h-screen bg-gray-950 text-gray-100 font-sans pb-24">
                    {/* Header */}
                    <header className="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
                        <div className="max-w-md mx-auto px-4 h-16 flex items-center justify-center relative">
                            <div className="flex items-center gap-2">
                                <CoinsIcon className="text-amber-500 w-6 h-6" />
                                <h1 className="text-xl font-bold bg-gradient-to-r from-amber-400 to-yellow-200 bg-clip-text text-transparent">
                                    코인스캐너
                                </h1>
                            </div>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="max-w-md mx-auto">
                        {activeTab === 'scan' && <ScannerTab />}
                        {activeTab === 'table' && <PriceTableTab />}
                        {activeTab === 'guide' && <GuideTab />}
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="bg-gray-900 border-t border-gray-800 fixed bottom-0 w-full z-50">
                        <div className="max-w-md mx-auto flex justify-around p-2">
                            <NavButton 
                                active={activeTab === 'scan'} 
                                onClick={() => setActiveTab('scan')} 
                                icon={<CameraIcon size={20} />} 
                                label="AI 감정" 
                            />
                            <NavButton 
                                active={activeTab === 'table'} 
                                onClick={() => setActiveTab('table')} 
                                icon={<ListIcon size={20} />} 
                                label="시세표" 
                            />
                            <NavButton 
                                active={activeTab === 'guide'} 
                                onClick={() => setActiveTab('guide')} 
                                icon={<InfoIcon size={20} />} 
                                label="주의사항" 
                            />
                        </div>
                    </nav>
                </div>
            );
        }

        function NavButton({ active, onClick, icon, label }) {
            return (
                <button
                    onClick={onClick}
                    className={`flex flex-col items-center justify-center w-20 py-2 rounded-xl transition-all duration-200 ${
                        active ? 'text-amber-400 bg-amber-400/10' : 'text-gray-500 hover:text-gray-300'
                    }`}
                >
                    {icon}
                    <span className="text-xs mt-1 font-medium">{label}</span>
                </button>
            );
        }

        function ScannerTab() {
            const [image, setImage] = useState(null);
            const [scanStatus, setScanStatus] = useState('idle'); // 'idle', 'compressing', 'scanning', 'result'
            const [selectedCoin, setSelectedCoin] = useState('100원');
            const [selectedYear, setSelectedYear] = useState('1998');
            const [selectedCondition, setSelectedCondition] = useState('미사용');
            const [errorMessage, setErrorMessage] = useState('');

            // 모바일 초고화질 사진 실시간 압축 함수
            const handleImageProcess = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setScanStatus('compressing');
                setErrorMessage('');

                // FileReader 대신 메모리 효율이 극도로 뛰어난 Object URL 사용
                const imageUrl = URL.createObjectURL(file);
                const img = new Image();
                img.src = imageUrl;

                img.onload = () => {
                    // 메모리 해제
                    URL.revokeObjectURL(imageUrl);

                    // 최대 너비/높이를 800px로 제한하여 해상도 다이어트
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    // 가상 캔버스를 통해 이미지 리사이징 및 압축
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // 용량을 100분의 1로 줄인 JPEG 데이터 (압축 품질 0.7)
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    
                    setImage(compressedDataUrl);
                    startScanning();
                };

                img.onerror = () => {
                    URL.revokeObjectURL(imageUrl);
                    setErrorMessage('이미지를 읽는 중 오류가 발생했습니다. 다시 촬영해주세요.');
                    setScanStatus('idle');
                };
            };

            const startScanning = () => {
                setScanStatus('scanning');
                setTimeout(() => {
                    setScanStatus('result');
                }, 2500);
            };

            const resetScan = () => {
                setImage(null);
                setScanStatus('idle');
                setErrorMessage('');
            };

            const findPrice = () => {
                let match = COIN_DATABASE.find(c => c.type === selectedCoin && c.year.includes(selectedYear) && c.condition === selectedCondition);
                if (!match) {
                    match = COIN_DATABASE.find(c => c.type === selectedCoin && c.year.includes(selectedYear));
                }
                return match;
            };

            const resultData = findPrice();

            return (
                <div className="p-4">
                    {/* 에러 메시지 출력 */}
                    {errorMessage && (
                        <div className="mb-4 bg-red-900/30 border border-red-900/50 rounded-xl p-3 text-sm text-red-200 text-center">
                            {errorMessage}
                        </div>
                    )}

                    {scanStatus === 'idle' && (
                        <div className="mt-6">
                            <div className="text-center mb-8">
                                <h2 className="text-2xl font-bold text-white mb-2">희귀 동전 감정하기</h2>
                                <p className="text-gray-400 text-sm">동전의 앞/뒷면을 선명하게 촬영해주세요.</p>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                {/* 카메라 촬영 버튼 */}
                                <label 
                                    htmlFor="camera-input"
                                    className="border-2 border-dashed border-gray-700 bg-gray-900/50 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer hover:border-amber-500/50 hover:bg-amber-500/5 transition-all group"
                                >
                                    <div className="bg-gray-800 p-4 rounded-full mb-4 group-hover:bg-amber-500/20 group-hover:scale-110 transition-all">
                                        <CameraIcon className="w-8 h-8 text-amber-400" />
                                    </div>
                                    <p className="text-base font-medium text-gray-300">카메라 촬영</p>
                                    <p className="text-xs text-gray-500 mt-1">직접 사진 찍기</p>
                                </label>
                                <input 
                                    id="camera-input"
                                    type="file" 
                                    accept="image/*" 
                                    capture="environment" 
                                    className="hidden" 
                                    onChange={handleImageProcess}
                                />

                                {/* 갤러리 업로드 버튼 */}
                                <label 
                                    htmlFor="gallery-input"
                                    className="border-2 border-dashed border-gray-700 bg-gray-900/50 rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer hover:border-blue-500/50 hover:bg-blue-500/5 transition-all group"
                                >
                                    <div className="bg-gray-800 p-4 rounded-full mb-4 group-hover:bg-blue-500/20 group-hover:scale-110 transition-all">
                                        <UploadIcon className="w-8 h-8 text-blue-400" />
                                    </div>
                                    <p className="text-base font-medium text-gray-300">사진 업로드</p>
                                    <p className="text-xs text-gray-500 mt-1">갤러리에서 선택</p>
                                </label>
                                <input 
                                    id="gallery-input"
                                    type="file" 
                                    accept="image/*" 
                                    className="hidden" 
                                    onChange={handleImageProcess}
                                />
                            </div>
                            
                            <div className="mt-8 bg-amber-900/20 border border-amber-900/50 rounded-xl p-4 flex gap-3">
                                 <AlertTriangleIcon className="text-amber-500 shrink-0 mt-0.5 w-5 h-5" />
                                 <div className="text-sm text-amber-200/80">
                                     <p className="font-semibold text-amber-500 mb-1">정확한 감정을 위한 팁</p>
                                     <p>빛 반사가 적은 밝은 곳에서 촬영하면 연도와 상태를 더 정확히 판독할 수 있습니다.</p>
                                 </div>
                            </div>
                        </div>
                    )}

                    {/* 압축 진행 표시 */}
                    {scanStatus === 'compressing' && (
                        <div className="mt-12 flex flex-col items-center justify-center py-12">
                            <RefreshCwIcon className="w-10 h-10 text-amber-500 animate-spin mb-4" />
                            <p className="text-lg font-medium text-amber-400">이미지 용량 최적화 중...</p>
                            <p className="text-xs text-gray-500 mt-2">고해상도 사진을 안정적인 용량으로 조절하고 있습니다.</p>
                        </div>
                    )}

                    {/* 스캐닝 레이저 효과 화면 */}
                    {scanStatus === 'scanning' && (
                        <div className="mt-8 flex flex-col items-center">
                            <div className="relative w-full max-w-sm aspect-square rounded-2xl overflow-hidden border border-gray-700">
                                <img src={image} alt="Uploading coin" className="object-cover w-full h-full opacity-50" />
                                <div className="absolute inset-x-0 top-0 bg-gradient-to-b from-transparent via-amber-500/50 to-transparent w-full h-1/2 animate-scan" />
                                <div className="absolute inset-0 flex items-center justify-center">
                                     <div className="bg-gray-900/80 backdrop-blur-sm px-6 py-3 rounded-full flex items-center gap-3 border border-gray-700">
                                         <RefreshCwIcon className="w-5 h-5 text-amber-500 animate-spin" />
                                         <span className="font-medium text-sm">AI가 이미지를 분석 중입니다...</span>
                                     </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {scanStatus === 'result' && (
                        <div className="mt-4 space-y-6">
                            <div className="flex justify-between items-center">
                                <h2 className="text-xl font-bold">감정 결과</h2>
                                <button onClick={resetScan} className="text-sm text-gray-400 hover:text-white flex items-center gap-1">
                                    <RefreshCwIcon size={14} /> 다시 검사
                                </button>
                            </div>

                            <div className="flex gap-4 items-start">
                                <div className="w-24 h-24 rounded-xl overflow-hidden border border-gray-700 shrink-0 relative">
                                    <img src={image} alt="Scanned coin" className="object-cover w-full h-full" />
                                    <div className="absolute top-0 right-0 bg-amber-500 text-gray-950 text-[10px] font-bold px-1.5 py-0.5 rounded-bl-lg">
                                        <CheckCircleIcon size={10} className="inline mr-1" />판독완료
                                    </div>
                                </div>
                                
                                <div className="flex-1 space-y-3">
                                    <p className="text-sm text-gray-400">AI가 인식한 정보를 확인하고, 필요시 수정해주세요.</p>
                                    
                                    <div className="grid grid-cols-2 gap-2">
                                        <div className="space-y-1">
                                            <label className="text-xs text-gray-500">액면가</label>
                                            <select 
                                                value={selectedCoin} 
                                                onChange={(e) => setSelectedCoin(e.target.value)}
                                                className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm focus:border-amber-500 focus:outline-none"
                                            >
                                                <option value="1원">1원</option>
                                                <option value="5원">5원</option>
                                                <option value="10원">10원</option>
                                                <option value="50원">50원</option>
                                                <option value="100원">100원</option>
                                                <option value="500원">500원</option>
                                            </select>
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-xs text-gray-500">연도</label>
                                            <input 
                                                type="number" 
                                                value={selectedYear} 
                                                onChange={(e) => setSelectedYear(e.target.value)}
                                                className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm focus:border-amber-500 focus:outline-none"
                                                placeholder="예: 1998"
                                            />
                                        </div>
                                    </div>
                                    
                                    <div className="space-y-1">
                                        <label className="text-xs text-gray-500">보존 상태</label>
                                        <select 
                                                value={selectedCondition} 
                                                onChange={(e) => setSelectedCondition(e.target.value)}
                                                className="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-sm focus:border-amber-500 focus:outline-none"
                                            >
                                                <option value="사용">사용 (유통품)</option>
                                                <option value="미사용">미사용 (보존상태 최상)</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-gradient-to-br from-gray-800 to-gray-900 border border-gray-700 rounded-2xl p-6 relative overflow-hidden">
                                 <div className="absolute -right-6 -top-6 w-24 h-24 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>
                                 
                                 {resultData ? (
                                     <>
                                         <div className="flex items-center gap-2 mb-2">
                                             <span className="bg-amber-500 text-gray-950 text-xs font-bold px-2 py-1 rounded-md">
                                                 희귀 동전 매칭
                                             </span>
                                             <span className="text-sm text-gray-400">{resultData.desc}</span>
                                         </div>
                                         <p className="text-gray-400 text-sm mt-4">예상 거래가 (기준: {resultData.condition})</p>
                                         <p className="text-3xl font-bold text-amber-400 mt-1">{resultData.price}</p>
                                         <p className="text-xs text-gray-500 mt-4 leading-relaxed">
                                             * 위 가격은 수집가들 사이의 예상 시세이며, 실제 거래 가격은 NGC 등 공식 등급 인증 결과와 보존 상태에 따라 크게 변동될 수 있습니다.
                                         </p>
                                     </>
                                 ) : (
                                     <div className="text-center py-4">
                                         <CoinsIcon className="w-12 h-12 text-gray-600 mx-auto mb-3" />
                                         <p className="text-lg font-medium text-gray-300">일반 유통 동전입니다.</p>
                                         <p className="text-sm text-gray-500 mt-2">
                                             해당 연도({selectedYear}년)의 {selectedCoin}은 특별한 희소성이 없어, 일반적으로 액면가와 동일하게 거래됩니다.
                                         </p>
                                     </div>
                                 )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function PriceTableTab() {
            const [searchTerm, setSearchTerm] = useState('');
            const filteredData = COIN_DATABASE.filter(coin => 
                coin.type.includes(searchTerm) || 
                coin.year.includes(searchTerm) ||
                coin.desc.includes(searchTerm)
            );

            return (
                <div className="p-4">
                    <div className="mb-6">
                        <h2 className="text-2xl font-bold text-white mb-2">희귀 동전 시세표</h2>
                        <p className="text-gray-400 text-sm">연도와 상태에 따른 대략적인 가치를 확인하세요.</p>
                    </div>
                    <div className="relative mb-6">
                        <SearchIcon className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 w-5 h-5" />
                        <input 
                            type="text" 
                            placeholder="액면가 또는 연도 검색 (예: 100원, 1998)"
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            className="w-full bg-gray-900 border border-gray-700 rounded-xl py-3 pl-10 pr-4 text-sm text-white focus:border-amber-500 focus:outline-none focus:ring-1 focus:ring-amber-500 transition-all"
                        />
                    </div>
                    <div className="space-y-3">
                        {filteredData.length > 0 ? (
                            filteredData.map((coin) => (
                                <div key={coin.id} className="bg-gray-800/50 border border-gray-700/50 rounded-xl p-4 flex items-center justify-between hover:bg-gray-800 hover:border-gray-600 transition-all">
                                    <div>
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className="text-lg font-bold text-white">{coin.type}</span>
                                            <span className="text-sm font-medium text-amber-500 bg-amber-500/10 px-2 py-0.5 rounded">{coin.year}</span>
                                        </div>
                                        <div className="text-xs text-gray-400 flex items-center gap-2">
                                            <span>{coin.desc}</span>
                                            <span className="w-1 h-1 bg-gray-600 rounded-full"></span>
                                            <span>{coin.condition} 기준</span>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <span className="text-sm font-bold text-amber-400">{coin.price}</span>
                                    </div>
                                </div>
                            ))
                        ) : (
                            <div className="text-center py-10 text-gray-500">
                                검색 결과가 없습니다.
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function GuideTab() {
            return (
                <div className="p-4">
                    <div className="mb-6">
                        <h2 className="text-2xl font-bold text-white mb-2">가치 평가 가이드</h2>
                        <p className="text-gray-400 text-sm">동전 거래 전 반드시 확인해야 할 사항입니다.</p>
                    </div>
                    <div className="space-y-4">
                        <div className="bg-gray-800 rounded-2xl p-5 border border-gray-700">
                            <h3 className="text-lg font-bold text-amber-400 mb-3 flex items-center gap-2">
                                <CoinsIcon className="w-5 h-5" /> 가격을 좌우하는 핵심 요소
                            </h3>
                            <ul className="space-y-3 text-sm text-gray-300">
                                <li className="flex gap-2">
                                    <span className="text-amber-500 font-bold">•</span>
                                    <div>
                                        <strong className="text-white block mb-0.5">발행 연도 (희소성)</strong>
                                        최초 발행 연도(예: 1966년 1원·5원·10원)나 IMF 등으로 발행량이 극히 적었던 해(예: 1998년 500원)의 동전이 높은 가치를 지닙니다.
                                    </div>
                                </li>
                                <li className="flex gap-2">
                                    <span className="text-amber-500 font-bold">•</span>
                                    <div>
                                        <strong className="text-white block mb-0.5">보존 상태 (Grade)</strong>
                                        미사용, 사용(유통품), 마모 정도에 따라 가격이 수십 배 차이 납니다. 유통된 동전은 희귀 연도라도 가치가 크게 떨어질 수 있습니다.
                                    </div>
                                </li>
                                <li className="flex gap-2">
                                    <span className="text-amber-500 font-bold">•</span>
                                    <div>
                                        <strong className="text-white block mb-0.5">주의! 절대 무리한 세척 금지</strong>
                                        동전 표면을 깨끗하게 만들기 위해 광을 내거나 약품 세척을 하면 표면이 미세하게 손상되어 동전 수집 가치가 치명적으로 하락(최대 90% 이상 가치 상실)합니다. 발견 당시 상태 그대로 보존해야 합니다.
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CoinAppraiser />);
    </script>
</body>
</html>
